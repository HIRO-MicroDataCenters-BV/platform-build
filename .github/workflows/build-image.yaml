name: Build Builder Image

on:
  schedule:
    - cron: '15 0 * * 0' # 15 0 every sunday
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && 'hiro-microdatacenters-bv/platform-build' || 'hiro-microdatacenters-bv/platform-build-dev' }} 
  BRANCH_NAME: ${GITHUB_REF##*/}

jobs: 
 
  build-docker: 
    name: Docker Build / ${{ matrix.platform }} / ${{ matrix.os }}
    runs-on: ubuntu-latest

    # If it's a cron job, it MUST be on main. If it's workflow_dispatch, any branch is fine.
    if: |
      (github.event_name == 'schedule' && github.ref_name == 'main') || 
      github.event_name == 'workflow_dispatch'
  
    strategy:  
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          - linux/arm64          
        os:
          - ubuntu-22.04
          - ubuntu-24.04
          - ubuntu-26.04
        isMain:
          - ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}

    defaults:
      run:
        working-directory: ./
    permissions:
      contents: write
      packages: write

    steps:
      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "OS_ARCH=${{ matrix.os }}-${platform//\//-}" >> $GITHUB_ENV

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Make versions
        run: |
          cd "${{ github.workspace }}"
          chmod +x ./builder/version.sh
          ./builder/version.sh "${{ github.sha }}" "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          VERSION_DOCKER_BASE=$(cat ./builder/VERSION_DOCKER)
          echo "$VERSION_DOCKER_BASE" | sed "s/^/${OS_ARCH}-/; s/,/\n${OS_ARCH}-/g" > /tmp/tags.txt
          {
            echo "DOCKER_TAGS<<EOF"
            cat /tmp/tags.txt
            echo "EOF"
          } >> $GITHUB_ENV
          echo "DOCKER_TAG_ARGS=$(cat "./builder/VERSION_DOCKER" | sed 's/,/,${{ env.OS_ARCH }}-/g; s/^/${{ env.OS_ARCH }}-/' | sed 's/,/,name=/g; s/^/name=/')" >> $GITHUB_ENV
      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: ${{ env.DOCKER_TAGS }}
      
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          push: true
          sbom: true
          provenance: true
          context: .
          file: ./builder/${{ matrix.os }}.Dockerfile
          platforms: ${{ matrix.platform }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.os }}-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.os }}-${{ matrix.platform }}
