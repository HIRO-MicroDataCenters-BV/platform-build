apiVersion: v1
kind: Pod
metadata:
  name: pytorch-gpu-test
spec:
  restartPolicy: Never
  containers:
  - name: pytorch
    image: pytorch/pytorch:2.2.0-cuda12.1-cudnn8-runtime
    command: ["python3", "-c"]
    args:
    - |
      import torch
      import time

      print("=== CUDA Availability Check ===")
      print(f"CUDA Available: {torch.cuda.is_available()}")
      print(f"Device Count: {torch.cuda.device_count()}")
      print(f"Device Name: {torch.cuda.get_device_name(0)}")

      # VRAM Allocation Test
      print("\n=== Allocating 10 GB VRAM ===")
      x = torch.empty((1024, 1024, 2500), device='cuda', dtype=torch.float32)
      print(f"Allocated: {torch.cuda.memory_allocated(0) / 1e9:.2f} GB")

      # Compute Stress Test (10,000 x 10,000 Matrix Multiplication)
      print("\n=== Running FP32 Matrix Multiplication ===")
      a = torch.randn(10000, 10000, device='cuda')
      b = torch.randn(10000, 10000, device='cuda')

      start = time.time()
      for _ in range(50):
          c = torch.matmul(a, b)
      torch.cuda.synchronize()
      end = time.time()

      print(f"Completed 50 iterations in {end - start:.2f} seconds.")
      print("=== GPU TEST PASSED ===")
    resources:
      limits:
        nvidia.com/gpu: 1