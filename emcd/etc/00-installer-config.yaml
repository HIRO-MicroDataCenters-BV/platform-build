network:
  version: 2
  ethernets:
    enp3s0f4:
      match:
        macaddress: 00:00:00:00:00:00
      accept-ra: true
      dhcp4: false
      dhcp6: false
      nameservers:
        addresses:
          - 1.1.1.1
          - 8.8.8.8
      routes:
        - to: default
          via: 192.168.22.1
      addresses:
        - 192.168.22.2/24
        - fd00:22::2/64 
